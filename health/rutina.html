<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Rutina · Health</title>
<!-- fetch con el token de la cuenta (lo usa la sincronizacion de abajo) -->
<script type="module">import { authFetch } from './auth.js'; window.healthFetch = authFetch;</script>
<style>
  :root{
    --bg:var(--h-bg); --card:var(--h-panel); --card2:var(--h-panel-2); --track:var(--h-panel-3);
    --line:var(--h-border); --line2:var(--h-border-2); --text:var(--h-text); --text2:var(--h-text-2); --muted:var(--h-muted);
    --accent:var(--h-rutina); --soft:var(--h-rutina-soft); --ok:var(--h-ok); --ok-soft:var(--h-ok-soft);
  }
  *,*::before,*::after{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{margin:0;font-size:15px;line-height:1.45;padding:26px 32px 60px;}
  main{max-width:1240px;margin:0 auto;}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .muted{color:var(--muted);}

  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;}
  .top .h-head{margin:0;min-width:0;}
  .tools{display:flex;gap:8px;flex-shrink:0;position:relative;}
  /* Menu de opciones (voz, pitido, auto-avance, pantalla, reiniciar) */
  .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--card);border:1px solid var(--line2);border-radius:14px;
    padding:6px;min-width:230px;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.45);}
  .mi{display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;text-align:left;padding:11px 12px;
    border-radius:10px;font-size:14px;font-weight:500;color:var(--text2);}
  .mi:hover{background:var(--card2);}
  .mi[aria-pressed]::after{content:"";width:34px;height:20px;border-radius:10px;flex-shrink:0;
    background:radial-gradient(circle 7px at 10px 50%,#fff 96%,transparent) var(--line2);}
  .mi[aria-pressed="true"]::after{background:radial-gradient(circle 7px at 24px 50%,#fff 96%,transparent) var(--accent);}
  .mi.sep{border-top:1px solid var(--line);border-radius:0 0 10px 10px;margin-top:4px;color:var(--h-danger);}
  /* Peso y reps de la serie (rutinas propias) */
  .adj{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .ad{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;}
  .ad button{width:36px;height:36px;border-radius:9px;border:0;background:var(--card);font-size:18px;font-weight:600;}
  .ad span{min-width:64px;text-align:center;font-size:13px;color:var(--muted);}
  .ad b{font-size:17px;color:var(--text);font-variant-numeric:tabular-nums;}
  .donerow{grid-column:1/-1;display:flex;align-items:center;gap:10px;justify-content:space-between;background:transparent;
    border:1px dashed var(--line2);border-radius:14px;padding:11px 14px;color:var(--muted);font-size:13px;font-weight:600;}
  .donerow b{color:var(--ok);}
  .tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--muted);
    padding:9px 14px;border-radius:12px;font-weight:600;font-size:13px;white-space:nowrap;}
  .tbtn[aria-pressed="true"]{color:var(--text);border-color:var(--accent);background:var(--soft);}

  /* Selector de rutinas */
  .picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .rchip{border:1px solid var(--line2);background:transparent;color:var(--text2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;}
  .rchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .rchip.add,.rchip.edit{border-style:dashed;color:var(--muted);}

  /* Barra de progreso fija (aparece al empezar) */
  .sticky{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -32px 14px;padding:10px 32px;border-bottom:1px solid var(--line);}
  .sticky[hidden]{display:none;}
  .srow{display:flex;align-items:center;gap:12px;}
  .sbar{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden;}
  .sbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .3s;}
  .scount{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;}
  .mini{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;}
  .mini[hidden]{display:none;}
  .mini .mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);}
  .mini .mt{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--accent);}
  .mini.rest .mt{color:var(--ok);}
  .mini button{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px;}

  /* Fases de la rutina */
  .steps{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:12px;margin-bottom:16px;}
  .step{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;}
  .step.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft);}
  .step .sh{display:flex;justify-content:space-between;gap:8px;font-weight:600;}
  .step .sh span{color:var(--muted);font-weight:500;white-space:nowrap;}
  .bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:10px;}
  .bar b{display:block;height:100%;border-radius:3px;background:var(--accent);}
  .step.full .bar b{background:var(--ok);}

  /* Ejercicio actual */
  .hero{scroll-margin-top:96px;display:grid;grid-template-columns:300px 1fr;gap:32px;padding:28px;margin-bottom:16px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;}
  .clock{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .ring{position:relative;width:240px;height:240px;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring .trk{fill:none;stroke:var(--track);stroke-width:6;}
  .ring .arc{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s linear;}
  .ring.idle .arc{opacity:.3;} .ring.rest .arc{stroke:var(--ok);}
  .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;}
  .ring .big{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;}
  .ring .small{color:var(--muted);font-size:14px;margin-top:4px;}
  .ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);
    padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;white-space:nowrap;}
  .btn.blue{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.green{background:var(--ok);border-color:var(--ok);color:#06140d;}
  .label{font-size:13px;font-weight:600;color:var(--muted);}
  .hero h2{margin:2px 0 2px;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15;}
  .sub{color:var(--text2);font-size:14px;}
  .ph{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px;}
  .ph span{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--muted);}
  .ph .past{text-decoration:line-through;opacity:.6;} .ph .on{background:var(--accent);color:#fff;}
  ol.st{display:flex;flex-direction:column;gap:10px;padding-left:20px;margin:0;color:var(--text2);}
  ol.st li::marker{color:var(--accent);font-weight:700;}
  .tip{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--h-warn-soft);color:var(--h-warn);font-size:14px;}
  .note{margin-top:14px;color:var(--text2);white-space:pre-wrap;}
  .img{display:inline-block;margin-top:14px;color:var(--muted);font-size:13px;}
  .finished{grid-column:1/-1;text-align:center;padding:16px 0;}
  .finished .ck{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;
    font-size:34px;margin:0 auto 12px;}

  /* Lista de ejercicios */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .bh{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 0;}
  .bh:first-child{margin-top:0;}
  .tile{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);
    cursor:pointer;min-width:0;}
  .tile .tt{flex:1;min-width:0;}
  .tile b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .tile small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile.done{background:transparent;} .tile.done b{color:var(--muted);text-decoration:line-through;}
  .tile.now{border-color:var(--accent);background:var(--soft);}
  .tb{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--card2);
    color:var(--muted);flex-shrink:0;border:1px solid transparent;}
  .tile.done .tb{background:var(--ok-soft);color:var(--ok);}
  .tile.now .tb{background:var(--accent);color:#fff;}
  footer{margin-top:28px;color:var(--muted);font-size:13px;text-align:center;}

  /* Editor de rutinas */
  dialog{background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:18px;padding:0;width:min(720px,94vw);
    max-height:90vh;}
  dialog::backdrop{background:rgba(0,0,0,.6);}
  .edf{display:flex;flex-direction:column;max-height:90vh;}
  .edh{display:flex;gap:10px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
  .edb{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:10px;}
  .edfoot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);}
  dialog input,dialog select,dialog textarea{background:var(--bg);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:14px;
    padding:9px 10px;border-radius:10px;width:100%;min-width:0;}
  dialog input:focus,dialog select:focus,dialog textarea:focus{outline:none;border-color:var(--accent);}
  #edName{font-size:17px;font-weight:600;}
  .x{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px;}
  .er{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card2);}
  .er1{display:flex;gap:6px;align-items:center;}
  .er1 .en{font-weight:600;}
  .ib{background:var(--card);border:1px solid var(--line2);border-radius:9px;width:34px;height:36px;flex-shrink:0;color:var(--muted);}
  .er2{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;}
  .er2 label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted);}
  .er2 label.chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--text2);padding-bottom:9px;}
  .er2 label.chk input{width:auto;}
  .edrow{display:flex;gap:8px;flex-wrap:wrap;}
  textarea{min-height:120px;resize:vertical;}
  .hint{font-size:12px;color:var(--muted);}
  .danger{color:var(--h-danger);}
  .edmsg{color:var(--h-warn);font-size:13px;}

  /* Celebracion al completar la rutina */
  .celebrate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:rgba(8,9,12,.78);animation:celIn .25s ease-out;overflow:hidden;}
  .cel-card{position:relative;z-index:2;background:var(--card);border:1px solid var(--line2);border-radius:18px;
    padding:26px 22px;text-align:center;width:86%;max-width:320px;animation:celPop .45s cubic-bezier(.2,1.4,.4,1);}
  .cel-emoji{font-size:3.4rem;line-height:1.1;}
  .cel-card h2{margin:8px 0 4px;font-size:1.45rem;}
  .cel-card p{margin:0 0 18px;font-size:1.05rem;font-weight:600;color:var(--text2);}
  .cel-card .btn{width:100%;}
  .confetti{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(112vh) rotate(760deg);}}
  @keyframes celPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes celIn{from{opacity:0}}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;gap:20px;}
    .tiles{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:640px){
    body{padding:18px 16px 40px;}
    .top{flex-direction:column;align-items:stretch;gap:12px;}
    .top{position:relative;}
    .top .h-head{padding-right:52px;}
    .tools{position:absolute;right:0;bottom:2px;}
    .tbtn .tx{display:none;}
    .tbtn{padding:9px 11px;}
    .picker{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none;}
    .sticky{margin:0 -16px 12px;padding:10px 16px;}
    .steps{display:flex;overflow-x:auto;gap:8px;margin:-4px -16px 8px;padding:4px 16px;scrollbar-width:none;}
    .step{min-width:72%;padding:12px 14px;}
    .hero{padding:18px;gap:18px;border-radius:16px;margin-bottom:12px;}
    .ring{width:200px;height:200px;} .ring .big{font-size:44px;}
    .hero h2{font-size:25px;}
    .tiles{grid-template-columns:1fr;gap:8px;}
    .er2{grid-template-columns:repeat(3,1fr);}
    dialog{width:100vw;max-width:100vw;max-height:100%;height:100%;border-radius:0;margin:0;}
    .edf{max-height:100%;height:100%;}
    .edb{flex:1;}
  }
</style>
<link rel="stylesheet" href="theme.css">
<script type="module" src="swipe.js"></script>
</head>
<body>
<main>
  <div class="top">
    <header class="h-head"><h1 id="title">Rutina</h1><p id="meta"></p></header>
    <div class="tools">
      <button class="tbtn" id="optBtn" aria-expanded="false" aria-label="Opciones">⚙<span class="tx"> Opciones</span></button>
      <div class="menu" id="optMenu" hidden>
        <button class="mi" id="voiceBtn">🔊 Voz</button>
        <button class="mi" id="soundBtn">🔔 Pitido</button>
        <button class="mi" id="autoBtn" title="Al terminar un ejercicio, pasa al siguiente">⏭ Auto-avance</button>
        <button class="mi" id="wakeBtn" title="Mantener la pantalla encendida">💡 Pantalla</button>
        <button class="mi sep" id="resetBtn">↺ Reiniciar el día</button>
      </div>
    </div>
  </div>
  <div class="picker" id="picker"></div>

  <div class="sticky" id="sticky" hidden>
    <div class="srow"><div class="sbar"><i id="sFill"></i></div><span class="scount" id="sCount">0/0</span></div>
    <div class="mini" id="mini" hidden><span class="mn" id="mName"></span><span class="mt" id="mTime"></span><button id="mBtn"></button></div>
  </div>

  <div class="steps" id="steps"></div>
  <section class="hero" id="hero"></section>
  <div class="tiles" id="tiles"></div>
  <footer id="foot"></footer>
</main>

<dialog id="ed">
  <form method="dialog" class="edf">
    <div class="edh">
      <input id="edName" placeholder="Nombre de la rutina (ej. Pierna, Empuje, Día A)" autocomplete="off">
      <button class="x" value="cancel" aria-label="Cerrar">✕</button>
    </div>
    <div class="edb">
      <div id="edList" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="edrow">
        <button type="button" class="btn" id="edAdd">＋ Ejercicio</button>
        <button type="button" class="btn" id="edPasteBtn">Pegar lista</button>
      </div>
      <div id="edPaste" hidden style="display:flex;flex-direction:column;gap:8px">
        <textarea id="edText" placeholder="Un ejercicio por línea, por ejemplo:&#10;Sentadilla 4x8 60kg desc 120&#10;Peso muerto rumano 3x10 40kg&#10;Zancadas 3x12 c/l&#10;Plancha 3x45s"></textarea>
        <div class="hint">Formato: nombre, series x reps (o x segundos con «s»), peso en kg, «desc 90» para el descanso y «c/l» si es por lado.</div>
        <div><button type="button" class="btn blue" id="edParse">Agregar a la lista</button></div>
      </div>
      <div class="edmsg" id="edMsg"></div>
    </div>
    <div class="edfoot">
      <button type="button" class="btn danger" id="edDel">Eliminar</button>
      <span style="flex:1"></span>
      <button class="btn" value="cancel">Cancelar</button>
      <button type="button" class="btn blue" id="edSave">Guardar</button>
    </div>
  </form>
</dialog>

<script type="module">
import {BUILTIN,compile,dur,phasesOf,doseOf} from './rutina-data.js';
import {loadLocal as bmLoad,saveLocal as bmSave,pull as bmPull,push as bmPush} from './metricas/sync.js';
// App Android (Capacitor, health-app/): sus plugins propios; null en la web.
// Las pestanas viven en iframes: el puente nativo es el de la pagina principal.
const nativeApp=()=>{try{const c=(window.parent!==window&&parent.Capacitor)||window.Capacitor;return c?.isNativePlatform?.()&&c.Plugins?.Native||null;}catch(e){return null;}};
// Vibracion corta al tocar (la del teclado del sistema, solo en la app)
const haptic=k=>{const n=nativeApp();if(n)n.haptic({kind:k||'key'}).catch(()=>{});};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function fmt(s){return pad(Math.floor(s/60))+':'+pad(s%60);}


/* ---------- estado y persistencia ---------- */
const LS_KEY='health_rutina_v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){}
const hist=Array.isArray(saved.history)?saved.history:[];
let custom=Array.isArray(saved.routines)?saved.routines:[];
let active=saved.routine||'estiramiento';
let curDate=today();
// done por rutina; el formato viejo solo tenia "done" de la de estiramiento
const doneByOf=r=>r.date===today()?(r.doneBy||(r.done?{[r.routine||'estiramiento']:r.done}:{})):{};
let doneBy=doneByOf(saved);
const state={voice:true,sound:true,auto:true,wake:null};
if(saved.prefs)['voice','sound','auto'].forEach(k=>{if(typeof saved.prefs[k]==='boolean')state[k]=saved.prefs[k];});

const routines=()=>[BUILTIN,...custom];
const getR=()=>routines().find(r=>r.id===active)||BUILTIN;
let items=[];
function load(){if(!routines().some(r=>r.id===active))active='estiramiento';items=compile(getR());}
function done(){
  if(curDate!==today()){curDate=today();doneBy={};} // paso la medianoche con la app abierta
  return doneBy[active]||(doneBy[active]={});
}
const nDone=()=>items.filter((_,i)=>done()[i]).length;
const firstPending=()=>items.findIndex((_,i)=>!done()[i]);

// Sincronizacion con la nube (worker de Habits, ruta /health/rutina): el
// historial se une; el progreso del dia, las rutinas y preferencias gana el mas reciente.
const SYNC_URL='https://habits-worker.efrenalejandro2010.workers.dev/health/rutina';
let syncTimer=null,syncPending=false;
function snapshot(){
  // list: para que Hoy muestre los siguientes ejercicios sin conocer la rutina
  const list=items.map(it=>({name:it.name,dose:it.dose,dur:dur(it)}));
  return {date:today(),routine:active,name:getR().name,doneBy,done:done(),total:items.length,list,routines:custom,
    prefs:{voice:state.voice,sound:state.sound,auto:state.auto},history:hist,updated:saved.updated||0};
}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(snapshot()));}catch(e){}}
function pushRemote(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{window.healthFetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(snapshot())}).then(r=>{syncPending=!r.ok;}).catch(()=>{syncPending=true;});},1200);
}
addEventListener('online',()=>{if(syncPending)pushRemote();});
function save(){saved.updated=Date.now();writeLocal();pushRemote();}

function streakCount(){
  const set=new Set(hist);let n=0;const d=new Date();
  if(!set.has(today()))d.setDate(d.getDate()-1); // la racha sigue viva si hoy aun no la haces
  while(true){const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(!set.has(k))break;n++;d.setDate(d.getDate()-1);}
  return n;
}

/* ---------- pintar ---------- */
let sel=null; // ejercicio elegido a mano; si no, el actual o el primero pendiente
let T={i:null,p:0,left:0,paused:false,id:null,to:null};
const current=()=>T.i!==null?T.i:(sel!==null&&sel<items.length?sel:firstPending());

function renderHead(){
  const r=getR(),n=nDone(),s=streakCount();
  $('title').textContent=r.name;
  const total=Math.round(items.reduce((a,it)=>a+dur(it),0)/60);
  $('meta').textContent=[s?`🔥 ${s} ${s===1?'día':'días'} de racha`:'',`${n} de ${items.length} hechos`,`~${total} min`].filter(Boolean).join(' · ');

    else{big=fmt(Math.max(T.left,0));frac=Math.max(T.left,0)/ph.s;

/* ---------- temporizador ---------- */
const spoken=l=>l.replace(/(\d+)\/(\d+)/,'$1 de $2').replace(' · ',', ');
// El reloj va por hora de fin (T.end): si el navegador frena los timers con la
// pantalla apagada o la app en segundo plano, al volver marca el tiempo real.
function start(i,p){
  clearInterval(T.id);clearTimeout(T.to);
  const it=items[i],ph=it.phases[p];
  const kg=T.i===i?T.kg:it.kg; // el peso ajustado sigue en las series siguientes
  // Fase con tiempo: primero se anuncia y la cuenta arranca cuando la voz termina
  // (T.end=0 mientras habla). El descanso arranca de una.
  const waitVoice=ph.s&&!ph.rest&&state.voice;
  T={i,p,left:ph.s,end:ph.s&&!waitVoice?Date.now()+ph.s*1000:0,ready:!waitVoice,cue:0,paused:false,id:null,to:null,kg,reps:ph.reps||0};sel=i;
  const run=T;
  wakeOn(true); // la pantalla no se apaga mientras corre el temporizador
  const pre=p===0?it.name+'. ':'';
  let spoken_;
  if(ph.rest)spoken_=say('Descanso. '+ph.s+' segundos.');
  else if(ph.reps)spoken_=say(pre+spoken(ph.l)+'. '+ph.reps+' repeticiones.');
  else spoken_=say(pre+spoken(ph.l)+'. Comienza.');
  if(waitVoice)spoken_.then(()=>{
    if(T!==run||T.ready)return; // se salto, detuvo o ya se reanudo a mano
    T.ready=true;
    if(!T.paused){T.end=Date.now()+T.left*1000;beep(1);nativeTimer();drawTime();}
  });
  if(ph.s)T.id=setInterval(tick,250);
  nativeTimer();
  renderAll();
  if(p===0&&innerWidth<=900)$('hero').scrollIntoView({behavior:'smooth',block:'start'});
}
function tick(){
  if(T.paused||!T.end)return;
  // avisos dentro de la fase (p. ej. "Cambia de sentido" a los 15 s)
  const ph=items[T.i].phases[T.p],el=(Date.now()-(T.end-ph.s*1000))/1000;
  const cue=ph.cues?.[T.cue];
  if(cue&&el>=cue.t){T.cue++;beep(1);if(navigator.vibrate)navigator.vibrate(150);haptic();say(cue.say);}
  const left=Math.ceil((T.end-Date.now())/1000);
  if(left===T.left)return;
  const prev=T.left;T.left=left;drawTime();
  if(prev>3&&left<=3&&left>0)beep(1);
  if(left<=0)nextPhase();
}
function togglePause(){
  T.paused=!T.paused;haptic();
  if(T.paused)T.end=0;else{T.end=Date.now()+T.left*1000;T.ready=true;}
  say(T.paused?'Pausa':'Seguimos');nativeTimer();renderHero();drawTime();
}
// App: aviso del sistema al terminar la cuenta, por si la app esta en segundo
// plano (la app lo programa al ocultarse y lo cancela al volver).
function nativeTimer(){
  const n=nativeApp();if(!n?.timer)return;
  if(T.i===null||T.paused||!T.end){n.timer({at:0}).catch(()=>{});return;}
  const it=items[T.i],ph=it.phases[T.p],nx=it.phases[T.p+1];
  n.timer({at:T.end,title:ph.rest?'Descanso terminado':it.name,
    body:ph.rest?`${it.name} · ${nx?.l||'sigue'}`:`Terminó ${ph.l}`+(nx?` · sigue ${nx.l}`:'')}).catch(()=>{});
}
function nextPhase(){
  if(T.i===null)return;
  clearInterval(T.id);
  const i=T.i,it=items[i],ph=it.phases[T.p],next=T.p+1;
  if(!ph.reps){beep(2);if(navigator.vibrate)navigator.vibrate([220,110,220]);}
  else{haptic();logSet(it,T.kg,T.reps);}
  if(next<it.phases.length){
    if(ph.reps)start(i,next);
    else{T.left=0;T.end=0;nativeTimer();drawTime();T.to=setTimeout(()=>start(i,next),700);}
    return;
  }
  rememberKg(it,T.kg);
  say('Ejercicio completado.');
  T={i:null,p:0,left:0,paused:false,id:null,to:null};nativeTimer();
  sel=null;
  if(!done()[i])setDone(i,true);else renderAll();

}

/* ---------- voz ---------- */
let esVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  esVoice = vs.find(v=>/^es[-_]/i.test(v.lang)&&/VE|MX|US|419/i.test(v.lang))
         || vs.find(v=>/^es/i.test(v.lang)) || null;
}

// Devuelve una promesa que se cumple cuando la voz termina de hablar. Si el motor
// no avisa (o es la app vieja, que responde al instante), se estima por palabras.
function say(txt){
  if(!state.voice)return Promise.resolve();
  const est=Math.min(7000,900+txt.split(/\s+/).length*380);
  const guess=ms=>new Promise(r=>setTimeout(r,ms));
  const n=nativeApp(); // el WebView de la app no trae speechSynthesis
  if(n)return n.say({text:txt}).then(r=>r&&r.done?null:guess(est)).catch(()=>guess(est));
  if(!('speechSynthesis' in window))return Promise.resolve();
  return new Promise(res=>{
    const t=setTimeout(res,est+2500);
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(txt);
      u.lang='es-419'; u.rate=1.05; u.pitch=1;
      if(esVoice)u.voice=esVoice;
      u.onend=u.onerror=()=>{clearTimeout(t);res();};
      speechSynthesis.speak(u);
    }catch(e){clearTimeout(t);res();}
  });
}

/* ---------- pitido ---------- */
let ctx;
function unlock(){
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',unlock);
function beep(n){
  if(!state.sound)return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    const offs = n===1 ? [0] : [0,0.2,0.4];
    offs.forEach((off,k)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine'; o.frequency.value = (n===2&&k===2)?1200:880;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.35,ctx.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+off+0.17);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+off);o.stop(ctx.currentTime+off+0.18);
    });
  }catch(e){}
}

let vid=null;
function vidOn(){
  if(vid)return true;
  try{
    const v=document.createElement('video');
    v.setAttribute('playsinline','');v.muted=true;v.loop=true;
    v.style.cssText='position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;bottom:0;left:0;';
    v.src='data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAr1tZGF0AAACrgYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0OA==';
    document.body.appendChild(v);const p=v.play();if(p)p.catch(()=>{});vid=v;return true;
  }catch(e){return false;}
}
// auto = la encendio el temporizador (se apaga sola al detener o terminar la rutina)
let autoWake=false;
async function wakeOn(auto){
  if(state.wake||vid)return;
  autoWake=!!auto;
  const n=nativeApp(); // en la app: la pantalla encendida es nativa
  if(n){n.keepAwake({on:true}).catch(()=>{});state.wake={release:()=>n.keepAwake({on:false})};paintTools();return;}
  if('wakeLock' in navigator){try{
    state.wake=await navigator.wakeLock.request('screen');
    state.wake.addEventListener('release',()=>{state.wake=null;paintTools();});
    paintTools();return;
  }catch(e){}}
  vidOn();paintTools();
}
async function wakeOff(){
  try{if(state.wake)await state.wake.release();}catch(e){}
  state.wake=null;if(vid){vid.pause();vid.remove();vid=null;}
  autoWake=false;paintTools();
}

    <p>🔥 ${n} ${n===1?'día':'días'} de racha</p><button class="btn blue">Seguir</button></div>`+
    Array.from({length:44},(_,k)=>`<i class="confetti" style="left:${Math.random()*100}%;background:${colors[k%colors.length]};
      animation-duration:${2.2+Math.random()*1.8}s;animation-delay:${Math.random()*.6}s"></i>`).join('');
  const close=()=>el.remove();
  el.onclick=close;setTimeout(close,7000);
  document.body.appendChild(el);
}

/* ---------- editor de rutinas propias ---------- */
let editing=null,draft=[];
const blank=()=>({name:'',type:'reps',sets:3,reps:10,secs:30,rest:60,kg:null,sides:false,note:''});
function openEditor(id){
  editing=id;
  const r=id&&custom.find(x=>x.id===id);
  $('edName').value=r?r.name:'';
  draft=r?r.items.map(x=>({...x})):[blank()];
  $('edDel').hidden=!r;$('edPaste').hidden=true;$('edMsg').textContent='';
  renderDraft();$('ed').showModal();
  if(!r)$('edName').focus();
}
function renderDraft(){
  $('edList').innerHTML=draft.map((x,j)=>`<div class="er" data-j="${j}">
    <div class="er1"><input class="en" value="${esc(x.name)}" placeholder="Ejercicio ${j+1}">
      <button type="button" class="ib" data-mv="-1" aria-label="Subir">↑</button><button type="button" class="ib" data-mv="1" aria-label="Bajar">↓</button>
      <button type="button" class="ib" data-del aria-label="Quitar">✕</button></div>
    <div class="er2">
      <label>Tipo<select class="et"><option value="reps"${x.type==='reps'?' selected':''}>Reps</option><option value="time"${x.type==='time'?' selected':''}>Tiempo</option></select></label>
      <label>Series<input class="es" type="number" min="1" max="20" inputmode="numeric" value="${x.sets}"></label>
      <label><span class="lr">${x.type==='time'?'Segundos':'Reps'}</span><input class="erp" type="number" min="1" inputmode="numeric" value="${x.type==='time'?x.secs:x.reps}"></label>
      <label>Descanso (s)<input class="ere" type="number" min="0" inputmode="numeric" value="${x.rest}"></label>
      <label>Peso (kg)<input class="ek" type="number" min="0" step="0.5" inputmode="decimal" value="${x.kg??''}" placeholder="—"></label>
      <label class="chk"><input class="esd" type="checkbox"${x.sides?' checked':''}>Por lado</label>
    </div>
    <input class="eno" value="${esc(x.note)}" placeholder="Nota o técnica (opcional)"></div>`).join('');
  $('edList').querySelectorAll('.er').forEach(row=>{
    const j=+row.dataset.j;
    row.querySelector('.et').onchange=e=>{row.querySelector('.lr').textContent=e.target.value==='time'?'Segundos':'Reps';
      const v=collect()[j];row.querySelector('.erp').value=e.target.value==='time'?v.secs:v.reps;};
    row.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
      draft=collect();const k=j+ +b.dataset.mv;if(k<0||k>=draft.length)return;
      [draft[j],draft[k]]=[draft[k],draft[j]];renderDraft();});
    row.querySelector('[data-del]').onclick=()=>{draft=collect();draft.splice(j,1);renderDraft();};
  });
}
const num=(v,d)=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:d;};
function collect(){
  return [...$('edList').querySelectorAll('.er')].map((row,j)=>{
    const q=c=>row.querySelector(c),type=q('.et').value,prev=draft[j]||blank(),v=Math.max(1,Math.round(num(q('.erp').value,10)));
    return {name:q('.en').value.trim(),type,sets:Math.min(20,Math.max(1,Math.round(num(q('.es').value,3)))),
      reps:type==='reps'?v:prev.reps,secs:type==='time'?v:prev.secs,rest:Math.max(0,Math.round(num(q('.ere').value,0))),
      kg:q('.ek').value===''?null:num(q('.ek').value,null),sides:q('.esd').checked,note:q('.eno').value.trim()};
  });
}
// "Sentadilla 4x8 60kg desc 120", "Plancha 3x45s", "Zancadas 3x12 c/l"
function parseLine(line){
  let t=line.trim(),m;const x=blank();
  if(!t)return null;
  if((m=t.match(/(\d+)\s*[x×]\s*(\d+)\s*(s|seg|segundos)?\b/i))){
    x.sets=+m[1];if(m[3]){x.type='time';x.secs=+m[2];x.rest=30;}else x.reps=+m[2];t=t.replace(m[0],' ');}
  if((m=t.match(/(\d+(?:[.,]\d+)?)\s*kg\b/i))){x.kg=num(m[1],null);t=t.replace(m[0],' ');}
  if((m=t.match(/desc(?:anso)?\.?\s*(\d+)\s*(s|seg)?/i))){x.rest=+m[1];t=t.replace(m[0],' ');}
  if((m=t.match(/c\/l|cada lado|por lado/i))){x.sides=true;t=t.replace(m[0],' ');}
  x.name=t.replace(/^[\s\-–—•*]*(\d+[.)]\s*)?/,'').replace(/[\s·\-–—:,]+$/,'').replace(/\s+/g,' ').trim();
  return x.name?x:null;
}
$('edAdd').onclick=()=>{draft=collect();draft.push(blank());renderDraft();
  const rows=$('edList').querySelectorAll('.en');rows[rows.length-1].focus();};
$('edPasteBtn').onclick=()=>{$('edPaste').hidden=!$('edPaste').hidden;if(!$('edPaste').hidden)$('edText').focus();};
$('edParse').onclick=()=>{
  const add=$('edText').value.split('\n').map(parseLine).filter(Boolean);
  if(!add.length){$('edMsg').textContent='No se reconoció ningún ejercicio';return;}
  draft=collect().filter(x=>x.name);draft.push(...add);
  $('edText').value='';$('edPaste').hidden=true;$('edMsg').textContent='';renderDraft();
};
$('edSave').onclick=()=>{
  const name=$('edName').value.trim(),list=collect().filter(x=>x.name);
  if(!name){$('edMsg').textContent='Ponle un nombre a la rutina';$('edName').focus();return;}
  if(!list.length){$('edMsg').textContent='Agrega al menos un ejercicio';return;}
  if(T.i!==null)stopAll();
  if(editing){
    const r=custom.find(x=>x.id===editing);
    // si cambiaron los ejercicios, el avance de hoy de esta rutina ya no corresponde
    if(JSON.stringify(r.items.map(x=>x.name))!==JSON.stringify(list.map(x=>x.name)))delete doneBy[editing];
    r.name=name;r.items=list;
  }else{
    const id='r'+Date.now().toString(36);
    custom.push({id,name,items:list});active=id;
  }
  sel=null;load();save();renderAll();$('ed').close();
};
$('edDel').onclick=()=>{
  const r=custom.find(x=>x.id===editing);
  if(!r||!confirm(`¿Eliminar la rutina «${r.name}»?`))return;
  if(T.i!==null)stopAll();
  custom=custom.filter(x=>x!==r);delete doneBy[r.id];
  if(active===r.id)active='estiramiento';
  sel=null;load();save();renderAll();$('ed').close();
};

/* ---------- arranque ---------- */
let ready=false;
load();renderAll();ready=true;

/* ---------- traer el estado de la nube y fusionarlo ---------- */
// window.healthFetch lo define un modulo, que corre antes del evento load
window.addEventListener('load',()=>window.healthFetch(SYNC_URL).then(r=>r.ok?r.json():null).then(res=>{
  const r=res&&res.data;
  if(!r){if(saved.updated||hist.length)pushRemote();return;}
  const remoteDays=(r.history||[]).length;
  (r.history||[]).forEach(d=>{if(!hist.includes(d))hist.push(d);});
  const localNewer=(saved.updated||0)>(r.updated||0);
  if((r.updated||0)>(saved.updated||0)&&T.i===null){
    // la nube es mas reciente: adoptar sus rutinas, progreso del dia y preferencias
    if(Array.isArray(r.routines))custom=r.routines;
    if(r.routine)active=r.routine;
    doneBy=doneByOf(r);
    if(r.prefs)['voice','sound','auto'].forEach(k=>{if(typeof r.prefs[k]==='boolean')state[k]=r.prefs[k];});
    saved.updated=r.updated;
    sel=null;load();
  }
  // subir si lo local es mas nuevo o tiene dias completados que la nube no tiene
  if(localNewer||hist.length>remoteDays)pushRemote();
  writeLocal();renderAll();
}).catch(()=>{}));
</script>
