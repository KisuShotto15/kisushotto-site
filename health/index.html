<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health">
<meta name="theme-color" content="#0e0f13">
<meta name="color-scheme" content="dark">
<title>Health · KS</title>
<link rel="icon" type="image/svg+xml" href="/images/health-favicon.svg">
<link rel="apple-touch-icon" href="/icons/health-192.png">
<link rel="manifest" href="/manifests/health.json">
<style>
  :root { --bg:#0e0f13; --panel:#17181d; --panel2:#1f2127; --border:#25272e; --border2:#32353e; --text:#ececf1;
    --muted:#80838e; --accent:#4f86ff; --tabh:62px; --toph:0px; }
  /* Sensacion de app: sin destello al tocar ni seleccion de texto en la navegacion */
  * { -webkit-tap-highlight-color:transparent; }
  .top, .tabs { -webkit-user-select:none; user-select:none; }
  /* En el celular no hay barra superior: la cuenta esta en el encabezado de Hoy */
  @media (max-width:759px) { .top { display:none !important; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  body { font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }

  /* Barra superior: marca, pestanas (escritorio) y cuenta */
  .top { position:fixed; left:0; right:0; top:0; z-index:10; height:calc(var(--toph) + env(safe-area-inset-top, 0px));
    padding:env(safe-area-inset-top, 0px) 16px 0; display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--bg); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
  .brand i { width:30px; height:30px; border-radius:9px; background:var(--accent); display:grid; place-items:center; color:#fff; }
  .avatar { width:34px; height:34px; border-radius:50%; background:var(--panel2); border:1px solid var(--border2); color:var(--text);
    display:grid; place-items:center; font:inherit; font-weight:700; font-size:13px; cursor:pointer; text-transform:uppercase; }

  .frames { position:fixed; left:0; right:0; top:calc(var(--toph) + env(safe-area-inset-top, 0px));
    bottom:calc(var(--tabh) + env(safe-area-inset-bottom, 0px)); }
  .frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:transparent; opacity:1; transition:opacity .18s; }
  .frames iframe[hidden] { display:none; }
  .frames iframe.loading { opacity:0; }
  /* Placeholder mientras carga una pestana por primera vez */
  .skel { position:absolute; inset:0; padding:20px 16px; display:flex; flex-direction:column; gap:14px; pointer-events:none; max-width:1240px; margin:0 auto; }
  .skel i { display:block; border-radius:16px; background:linear-gradient(90deg,#17181d 25%,#1f2127 50%,#17181d 75%);
    background-size:200% 100%; animation:sk 1.2s ease-in-out infinite; }
  .skel i:nth-child(1) { height:30px; width:40%; } .skel i:nth-child(2) { height:16px; width:60%; }
  .skel i:nth-child(3), .skel i:nth-child(4) { height:130px; } .skel i:nth-child(5) { height:90px; }
  @keyframes sk { to { background-position:-200% 0; } }

  /* Pestanas: abajo en el celular, al centro de la barra superior en escritorio */
  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex;
    height:calc(var(--tabh) + env(safe-area-inset-bottom, 0px)); padding:0 6px env(safe-area-inset-bottom, 0px);
    background:rgba(23,24,29,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--border); }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:none; border:0; color:var(--muted); font:inherit; font-size:11px; font-weight:600; cursor:pointer;
    -webkit-tap-highlight-color:transparent; border-radius:9px; }
  .tab svg { width:22px; height:22px; }
  .tab[aria-selected="true"] { color:var(--c); }
  @media (min-width:760px) {
    :root { --tabh:0px; --toph:66px; }
    .top { padding:0 32px; }
    .tabs { left:50%; right:auto; bottom:auto; top:13px; transform:translateX(-50%); height:auto; padding:4px; gap:4px;
      background:var(--panel); border:1px solid var(--border); border-radius:12px; backdrop-filter:none; }
    .tab { flex-direction:row; padding:8px 16px; font-size:13px; }
    .tab svg { display:none; }
    .tab:hover { color:var(--text); }
    .tab[aria-selected="true"] { background:var(--panel2); color:var(--text); }
  }

  /* Login */
  .auth { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg); color:var(--text); }
  .auth[hidden] { display:none; }
  .auth-card { width:100%; max-width:360px; text-align:center; }
  .auth-card img { width:64px; height:64px; }
  .auth-card h1 { font-size:1.5rem; margin:10px 0 4px; letter-spacing:-.02em; }
  .auth-card p { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .auth-card input { width:100%; background:var(--panel); border:1px solid var(--border2); color:var(--text); font:inherit; font-size:1rem;
    padding:12px 14px; border-radius:12px; margin-bottom:10px; text-align:center; }
  .auth-card input:focus { outline:none; border-color:var(--accent); }
  .auth-card #a-code { letter-spacing:.3em; font-size:1.3rem; }
  .auth-btn { width:100%; background:var(--accent); color:#fff; border:0; font:inherit; font-weight:700; font-size:1rem;
    padding:12px; border-radius:12px; cursor:pointer; }
  .auth-btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border2); margin-bottom:14px; }
  .auth-btn:disabled { opacity:.5; }
  .auth-or { color:var(--muted); font-size:.85rem; margin:4px 0 14px; }
  .auth-link { background:none; border:0; color:var(--muted); font:inherit; font-size:.88rem; text-decoration:underline; cursor:pointer; margin-top:12px; }
  .auth-msg { min-height:1.3em; margin-top:12px; color:#fbbf24; font-size:.9rem; }
</style>
</head>
<body>

<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <img src="/images/health-icon.svg" alt="">
    <h1>Health</h1>
    <p>Entra con tu cuenta de kisushotto</p>
    <div id="a-step-email">
      <div id="a-pk-wrap" hidden>
        <button class="auth-btn ghost" id="a-pk">🔑 Entrar con passkey</button>
        <div class="auth-or">o con un código al correo</div>
      </div>
      <input type="email" id="a-email" placeholder="tu@correo.com" autocomplete="email" inputmode="email">
      <button class="auth-btn" id="a-send">Enviar código</button>
    </div>
    <div id="a-step-code" hidden>
      <input type="text" id="a-code" placeholder="Código" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="auth-btn" id="a-verify">Entrar</button>
      <button class="auth-link" id="a-back">Usar otro correo</button>
    </div>
    <div class="auth-msg" id="a-msg"></div>
  </div>
</div>

<header class="top">
  <div class="brand"><i><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></i>Health</div>
  <button class="avatar" id="avatar" title="Cuenta"></button>
</header>

<div class="frames">
  <div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <iframe id="f-hoy"       title="Hoy"       data-src="hoy.html" hidden></iframe>
  <iframe id="f-rutina"    title="Rutina"    data-src="rutina.html" hidden></iframe>
  <iframe id="f-nutricion" title="Nutrición" data-src="nutricion/?embed=1" hidden></iframe>
  <iframe id="f-metricas"  title="Métricas"  data-src="metricas/?embed=1" hidden></iframe>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="hoy" style="--c:#ececf1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>
    Hoy
  </button>
  <button class="tab" role="tab" data-tab="rutina" style="--c:#4f86ff">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M4 17l5-1 1.5-3"/><path d="M15 21l-1.5-5.5L10 13l1-6 3.5 3.5L18 11"/><path d="M11 7L7 9l-1 3"/></svg>
    Rutina
  </button>
  <button class="tab" role="tab" data-tab="nutricion" style="--c:#fb923c">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-1.5-2-5-2.5-6.5 0S4 14 6 18s4 3 6 2c2 1 4 2 6-2s2-8.5.5-11S13.5 5 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>
    Nutrición
  </button>
  <button class="tab" role="tab" data-tab="metricas" style="--c:#a78bfa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
    Métricas
  </button>
</nav>

<script type="module">
import { hasSession, requestCode, verifyCode, passkeysUsable, passkeyLogin, currentEmail } from './auth.js';
{
  const TABS = ['hoy', 'rutina', 'nutricion', 'metricas'];
  const btns = document.querySelectorAll('.tab');

  // Las iframes se cargan la primera vez que se abre su pestana y despues se
  // quedan vivas: el temporizador de la rutina sigue corriendo al cambiar.
  // history: 'push' (el usuario cambio de pestana: el boton atras vuelve a la
  // anterior), 'replace' (arranque) o 'none' (ya viene de atras/adelante).
  let current = null;
  // #peso (atajo del icono de la app) y #resumen (notificacion del domingo): Hoy
  // con el registro de peso o el resumen de la semana abiertos
  function tellHoy(type) {
    const f = document.getElementById('f-hoy');
    const send = () => f.contentWindow?.postMessage({ type }, location.origin);
    if (f.src && !f.classList.contains('loading')) send();
    else f.addEventListener('load', () => setTimeout(send, 400), { once: true });
  }
  function show(tab, history_ = 'push') {
    if (tab === 'peso' || tab === 'resumen') { show('hoy', 'replace'); tellHoy(tab === 'peso' ? 'health:weight' : 'health:week'); return; }
    if (!TABS.includes(tab)) tab = 'hoy';
    TABS.forEach(t => {
      const f = document.getElementById('f-' + t);
      const on = t === tab;
      if (on && !f.src) {
        f.classList.add('loading');
        f.addEventListener('load', () => f.classList.remove('loading'), { once: true });
        f.src = f.dataset.src;
      }
      else if (on && t === 'hoy' && f.hidden) f.contentWindow?.postMessage({ type: 'health:refresh' }, location.origin);
      f.hidden = !on;
    });
    btns.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    if (location.hash !== '#' + tab) {
      if (history_ === 'push' && current) history.pushState(null, '', '#' + tab);
      else if (history_ !== 'none') history.replaceState(null, '', '#' + tab);
    }
    current = tab;
  }

  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  window.addEventListener('hashchange', () => show(location.hash.slice(1), 'none'));

  // Mensajes de las pestanas: cambiar de pestana o recargar una que ya cargo
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'health:tab') show(e.data.tab);
    if (e.data.type === 'health:swipe') { // deslizar: pestana siguiente (+1) o anterior (-1)
      const i = TABS.indexOf(current) + e.data.dir;
      if (i >= 0 && i < TABS.length) show(TABS[i]);
    }
    if (e.data.type === 'health:reload') {
      const f = document.getElementById('f-' + e.data.tab);
      if (f && f.src) f.src = f.dataset.src;
    }
  });

  // ── Login (codigo al correo o passkey) ──────────────────────────────────
  const $ = id => document.getElementById(id);
  const msg = t => { $('a-msg').textContent = t || ''; };
  let started = false;
  // Avatar: inicial del correo; abre la seccion Cuenta de Hoy
  $('avatar').onclick = () => {
    show('hoy');
    $('f-hoy').contentWindow?.postMessage({ type: 'health:account' }, location.origin);
  };
  function start() {
    $('auth').hidden = true;
    $('avatar').textContent = (currentEmail() || '?')[0];
    $('avatar').title = currentEmail() || 'Cuenta';
    if (started) { // volvio a entrar tras expirar: recargar las pestanas con la sesion nueva
      TABS.forEach(t => { const f = $('f-' + t); if (f.src) f.src = f.dataset.src; });
      return;
    }
    started = true;
    // Hoy es la pantalla de inicio; un #pestana en la URL (p. ej. desde una notificacion) manda
    show(location.hash.slice(1) || 'hoy', 'replace');
    // App Android: la pestana de una notificacion tocada con la app cerrada
    const n = window.Capacitor?.isNativePlatform?.() && window.Capacitor.Plugins?.Native;
    n?.pushOpen?.().then(o => { if (/^\/#\w+$/.test(o?.url || '')) location.hash = o.url.slice(1); }).catch(() => {});
  }
  function askLogin() {
    $('auth').hidden = false;
    $('a-step-email').hidden = false; $('a-step-code').hidden = true;
    $('a-email').value = currentEmail() || $('a-email').value;
    msg('');
    passkeysUsable().then(ok => { $('a-pk-wrap').hidden = !ok; });
  }
  $('a-send').onclick = async () => {
    const email = $('a-email').value.trim().toLowerCase();
    if (!email.includes('@')) return msg('Escribe un correo válido');
    $('a-send').disabled = true; msg('Enviando código…');
    const r = await requestCode(email);
    $('a-send').disabled = false;
    if (r.ok) { $('a-step-email').hidden = true; $('a-step-code').hidden = false; msg('Te enviamos un código a ' + email); $('a-code').focus(); }
    else if (r.code === 'signup_disabled' || r.code === 'otp_disabled' || r.code === '422') msg('Este correo no tiene acceso. Pídele al administrador que lo agregue.');
    else if (r.code === 'over_email_send_rate_limit' || r.code === '429') msg('Espera un momento antes de pedir otro código.');
    else msg('No se pudo enviar el código. Intenta de nuevo.');
  };
  $('a-verify').onclick = async () => {
    const code = $('a-code').value.trim();
    if (!code) return msg('Escribe el código');
    $('a-verify').disabled = true; msg('Verificando…');
    const ok = await verifyCode($('a-email').value.trim().toLowerCase(), code);
    $('a-verify').disabled = false;
    if (ok) start(); else msg('Código incorrecto o vencido.');
  };
  $('a-back').onclick = () => { $('a-step-code').hidden = true; $('a-step-email').hidden = false; msg(''); };
  $('a-email').onkeydown = e => { if (e.key === 'Enter') $('a-send').click(); };
  $('a-code').onkeydown = e => { if (e.key === 'Enter') $('a-verify').click(); };
  $('a-pk').onclick = async () => {
    msg('Esperando la passkey…');
    try { await passkeyLogin(); start(); }
    catch (e) { msg(e?.name === 'NotAllowedError' ? 'Cancelado' : e.message); }
  };
  // Una pestana avisa que la sesion ya no vale (o el usuario cerro sesion)
  window.addEventListener('message', e => {
    if (e.origin === location.origin && e.data?.type === 'health:login') askLogin();
  });

  if (hasSession()) start(); else askLogin();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
