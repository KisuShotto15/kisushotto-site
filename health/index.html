<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health">
<meta name="theme-color" content="#0c110f">
<meta name="color-scheme" content="dark">
<title>Health · KS</title>
<link rel="icon" type="image/svg+xml" href="/images/health-favicon.svg">
<link rel="apple-touch-icon" href="/icons/health-192.png">
<link rel="manifest" href="/manifests/health.json">
<style>
  :root { --bg:#0c110f; --bar:#0a0e0c; --border:#22302a; --muted:#7d8f86; --tabh:62px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  .frames {
    position:fixed; left:0; right:0;
    top:env(safe-area-inset-top, 0px);
    bottom:calc(var(--tabh) + env(safe-area-inset-bottom, 0px));
  }
  .frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  .frames iframe[hidden] { display:none; }

  .tabs {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; height:calc(var(--tabh) + env(safe-area-inset-bottom, 0px));
    padding-bottom:env(safe-area-inset-bottom, 0px);
    background:var(--bar); border-top:1px solid var(--border);
  }
  .tab {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:none; border:0; color:var(--muted); font:inherit; font-size:11px; font-weight:600;
    letter-spacing:.02em; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .tab svg { width:22px; height:22px; }
  .tab .pill { display:flex; align-items:center; justify-content:center; width:56px; height:30px; border-radius:15px; transition:background .15s; }
  .tab[aria-selected="true"] { color:var(--c); }
  .tab[aria-selected="true"] .pill { background:color-mix(in srgb, var(--c) 16%, transparent); }
</style>
</head>
<body>

<div class="frames">
  <iframe id="f-rutina"    title="Rutina"    data-src="rutina.html" hidden></iframe>
  <iframe id="f-nutricion" title="Nutrición" data-src="../nutrition/?embed=1" hidden></iframe>
  <iframe id="f-metricas"  title="Métricas"  data-src="../body-metrics/?embed=1" hidden></iframe>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="rutina" style="--c:#43e68d">
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M4 17l5-1 1.5-3"/><path d="M15 21l-1.5-5.5L10 13l1-6 3.5 3.5L18 11"/><path d="M11 7L7 9l-1 3"/></svg></span>
    Rutina
  </button>
  <button class="tab" role="tab" data-tab="nutricion" style="--c:#c8f135">
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-1.5-2-5-2.5-6.5 0S4 14 6 18s4 3 6 2c2 1 4 2 6-2s2-8.5.5-11S13.5 5 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg></span>
    Nutrición
  </button>
  <button class="tab" role="tab" data-tab="metricas" style="--c:#3b82f6">
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>
    Métricas
  </button>
</nav>

<script>
(function () {
  const TABS = ['rutina', 'nutricion', 'metricas'];
  const KEY = 'health_last_tab';
  const btns = document.querySelectorAll('.tab');

  // Las iframes se cargan la primera vez que se abre su pestana y despues se
  // quedan vivas: el temporizador de la rutina sigue corriendo al cambiar.
  function show(tab) {
    if (!TABS.includes(tab)) tab = 'rutina';
    TABS.forEach(t => {
      const f = document.getElementById('f-' + t);
      const on = t === tab;
      if (on && !f.src) f.src = f.dataset.src;
      f.hidden = !on;
    });
    btns.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    try { localStorage.setItem(KEY, tab); } catch {}
    if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
  }

  btns.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));

  let initial = location.hash.slice(1);
  if (!TABS.includes(initial)) { try { initial = localStorage.getItem(KEY); } catch {} }
  show(initial);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
