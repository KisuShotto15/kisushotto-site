<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Pagos pendientes</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .card { background: #1a1d24; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .email { font-weight: 600; }
  .meta { color: #999; font-size: 13px; }
  .amount { font-size: 15px; font-weight: 600; color: #1D9E75; }
  button { background: #1D9E75; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .empty, .err { color: #999; text-align: center; padding: 30px 0; }
  .err { color: #e05252; }
</style>
</head>
<body>
<h1>Pagos pendientes de confirmar</h1>
<div id="list" class="empty">Cargando...</div>

<script>
var API_BASE = 'https://kisushotto-site.vercel.app';
var SESSION = { token: null, email: null };
try {
  var s = JSON.parse(localStorage.getItem('p2p_session') || 'null');
  if (s && s.token) SESSION = s;
} catch (e) {}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (SESSION.token || '') };
}

async function load() {
  var list = document.getElementById('list');
  if (!SESSION.token) {
    list.className = 'err';
    list.textContent = 'No hay sesion. Entra primero en /p2p-monitor/ con tu cuenta admin.';
    return;
  }
  try {
    var r = await fetch(API_BASE + '/api/payments/admin-pending', { headers: authHeaders() });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    render(d.invoices || []);
  } catch (e) {
    list.className = 'err';
    list.textContent = 'Error: ' + e.message;
  }
}

function render(invoices) {
  var list = document.getElementById('list');
  if (!invoices.length) {
    list.className = 'empty';
    list.textContent = 'No hay pagos pendientes.';
    return;
  }
  list.className = '';
  list.innerHTML = '';
  invoices.forEach(function (inv) {
    var card = document.createElement('div');
    card.className = 'card';
    var when = new Date(inv.created_at).toLocaleString('es-VE');
    card.innerHTML =
      '<div class="row">' +
        '<div>' +
          '<div class="email">' + inv.email + '</div>' +
          '<div class="meta">' + inv.plan + ' &middot; ' + when + '</div>' +
        '</div>' +
        '<div class="row" style="gap:10px">' +
          '<span class="amount">' + inv.amount + ' ' + inv.currency + '</span>' +
          '<button data-id="' + inv.id + '">Confirmar</button>' +
        '</div>' +
      '</div>';
    card.querySelector('button').onclick = function (ev) { confirm(inv.id, ev.target); };
    list.appendChild(card);
  });
}

async function confirm(invoiceId, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  try {
    var r = await fetch(API_BASE + '/api/payments/admin-confirm', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ invoiceId: invoiceId }),
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    load();
  } catch (e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Confirmar';
  }
}

load();
</script>
</body>
</html>
