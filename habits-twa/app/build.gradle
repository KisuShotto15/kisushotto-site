plugins { id 'com.android.application' }
android {
    namespace 'com.kisushotto.habits'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kisushotto.habits'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
        // Credenciales del widget: definir habitsToken y habitsEmail en ~/.gradle/gradle.properties
        resValue 'string', 'widget_api_token',  (project.findProperty('habitsToken') ?: '')
        resValue 'string', 'widget_user_email', (project.findProperty('habitsEmail') ?: '')
    }
    signingConfigs {
        release {
            storeFile file('../../habits-twa.keystore')
            storePassword 'habits2024'
            keyAlias 'habits-key'
            keyPassword 'habits2024'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
