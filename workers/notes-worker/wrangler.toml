name = "notes-worker"
main = "src/index.js"
compatibility_date = "2025-04-10"

[[d1_databases]]
binding = "DB"
database_name = "notes-db"
database_id = "dca76353-c498-4f75-85da-9568244b29a7"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "notes-attachments"

[[kv_namespaces]]
binding = "PUSH_KV"
id = "cf380b2236474d458eaaf9f0a4b37b10"

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "mailto:efrenalejandro2010@gmail.com"
# Quien puede entrar. VACIA = NO PASA NADIE (default seguro: es una app personal).
ALLOWED_EMAILS = "kisushotto.btc@proton.me"

# TOKEN y SESSION_SECRET ya no se usan: la identidad es el JWT del sitio y este
# worker no emite sesiones propias. Se pueden borrar con `wrangler secret delete`.
#
# Set as secrets via:
#   wrangler secret put JWT_SECRET       <- el mismo valor que en Vercel
#   wrangler secret put VAPID_PUBLIC
#   wrangler secret put VAPID_PRIVATE_JWK   (full JWK JSON: {"kty":"EC","crv":"P-256","d":"...","x":"...","y":"..."})
