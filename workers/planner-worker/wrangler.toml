name = "planner-worker"
main = "src/index.js"
compatibility_date = "2025-04-10"

[[kv_namespaces]]
binding = "PLANNER_KV"
id = "5a1338abbbda419c9a0a55a60bd065fa"

# Respaldo diario del estado (04:00 UTC = medianoche en Caracas). La copia expira
# sola a los 7 dias; GET ?backups la lista y POST ?restore=<fecha> la recupera.
[triggers]
crons = ["0 4 * * *"]

[vars]
# Quien puede entrar. VACIA = NO PASA NADIE (default seguro: son apps personales).
ALLOWED_EMAILS = "efrenalejandro2010@gmail.com"
# A quien pertenecen los datos que ya existian en la clave global unica, antes de
# que el estado pasara a ser por usuario. Se adoptan en su primera lectura.
OWNER_EMAIL = "efrenalejandro2010@gmail.com"

# JWT_SECRET va como secret, no como var (en [vars] quedaria en texto plano en el
# repo, que es justo el problema que este cambio viene a cerrar):
#   wrangler secret put JWT_SECRET      <- el mismo valor que en Vercel
