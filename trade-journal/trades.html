<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trades · Trade Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/images/tj-favicon.svg">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container" id="mainContainer">

  <nav class="left-nav">
    <a href="/" class="left-nav-back" title="Hub">
      <img src="/images/tj-favicon.png" style="width:36px;height:36px;border-radius:9px;object-fit:cover;display:block">
    </a>
    <div class="left-nav-divider"></div>
    <a href="./index.html" class="left-nav-item" title="Dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </a>
    <a href="./terminal.html" class="left-nav-item" title="Terminal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
    </a>
    <a href="./trades.html" class="left-nav-item active" title="Trades">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
    </a>
    <a href="./analytics.html" class="left-nav-item" title="Analytics">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    </a>
    <a href="./insights.html" class="left-nav-item" title="Insights">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 22h4M12 2a7 7 0 017 7c0 3-1.5 5-4 6.5V17a1 1 0 01-1 1h-4a1 1 0 01-1-1v-1.5C6.5 14 5 12 5 9a7 7 0 017-7z"/></svg>
    </a>
  </nav>

  <nav class="tm-mobile-nav">
    <a href="./index.html">Dashboard</a><a href="./terminal.html">Terminal</a><a href="./trades.html" class="active">Trades</a><a href="./analytics.html">Analytics</a><a href="./insights.html">Insights</a>
  </nav>

  <div class="page-header">
    <div class="page-header-label">// historial</div>
    <h1>TRADE <span>LIST</span></h1>
  </div>

  <!-- Estrategia y periodo -->
  <div class="tl-bar">
    <div class="tl-tabs" id="tlStrat">
      <button data-v="vwap" onclick="setStrat('vwap')">VWAP</button>
      <button data-v="swing" onclick="setStrat('swing')">Swing</button>
      <button data-v="" onclick="setStrat('')">Todas</button>
    </div>
    <div class="tl-seg" id="tlRange">
      <button data-v="today" onclick="setRange('today')">Hoy</button>
      <button data-v="week" onclick="setRange('week')">Semana</button>
      <button data-v="month" onclick="setRange('month')">Mes</button>
      <button data-v="all" onclick="setRange('all')">Todo</button>
    </div>
  </div>
  <div class="tl-bar">
    <input type="text" id="fSymbol" class="tl-in" placeholder="Símbolo" oninput="applyFiltersDebounced()">
    <button class="tl-btn" id="moreBtn" onclick="toggleMore()">Más filtros ▾</button>
    <button class="tl-rev" id="reviewBtn" onclick="toggleReview()">Por revisar <span id="reviewCount">0</span></button>
    <div class="tl-right">
      <select id="fSort" class="tl-in" onchange="applyFilters()" title="Ordenar">
        <option value="date">Ordenar: fecha</option>
        <option value="pnl">Ordenar: resultado</option>
        <option value="r">Ordenar: R</option>
      </select>
      <button class="tl-btn" onclick="toggleSelectMode()" id="selBtn" title="Etiquetar varios a la vez">Seleccionar</button>
      <button class="tl-btn" onclick="doExport()" title="Exportar CSV con las fechas del filtro">↓ CSV</button>
    </div>
  </div>

  <div class="tl-more hidden" id="morePanel">
    <select id="fExchange" onchange="applyFilters()"><option value="">Exchange</option><option value="bitget">Bitget</option><option value="binance">Binance</option></select>
    <select id="fOrigin" onchange="applyFilters()" title="Por donde entro la operacion"><option value="">Origen</option><option value="terminal">Terminal</option><option value="external">Fuera del terminal</option></select>
    <select id="fCategory" onchange="applyFilters()"><option value="">Mercado</option><option value="linear">Futuros USDT</option><option value="inverse">Futuros COIN-M</option><option value="spot">Spot</option></select>
    <select id="fSide" onchange="applyFilters()"><option value="">Lado</option><option value="long">Long</option><option value="short">Short</option></select>
    <select id="fSession" onchange="applyFilters()"><option value="">Sesión</option><option value="asia">Asia</option><option value="london">Londres</option><option value="ny">Nueva York</option><option value="other">Otra</option></select>
    <select id="fStatus" onchange="applyFilters()"><option value="">Estado</option><option value="closed">Cerrada</option><option value="open">Abierta</option></select>
    <label>Desde <input type="date" id="fFrom" onchange="customRange()"></label>
    <label>Hasta <input type="date" id="fTo" onchange="customRange()"></label>
    <button class="tl-btn" onclick="resetFilters()">↺ Limpiar filtros</button>
  </div>

  <div class="tl-cap">Totales de todo el filtro, no solo de lo que se ve en pantalla</div>
  <div class="tl-kpis" id="kpis"></div>

  <!-- Etiquetado masivo -->
  <div class="bulk-bar" id="bulkBar">
    <span class="bulk-count" id="bulkCount">0 seleccionados</span>
    <select id="bulkSetup" onchange="applyBulkTag('setup_tag', this.value); this.value=''"><option value="">Setup…</option></select>
    <select id="bulkStrategy" onchange="applyBulkTag('strategy_tag', this.value); this.value=''"><option value="">Estrategia…</option></select>
    <button class="btn btn-sm" onclick="selectAllVisible()">Todos</button>
    <button class="btn btn-sm" onclick="clearSelection()">Limpiar</button>
  </div>

  <div id="tradesBody"><div class="loading">Cargando…</div></div>
  <button class="tl-more-btn hidden" id="loadMore" onclick="loadMore()">Cargar más</button>

</div><!-- /container -->

<div class="toast" id="toast"></div>
<script type="module" src="./trades.js"></script>
</body>
</html>
