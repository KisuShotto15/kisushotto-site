name: Deploy App Workers

# Despliega los workers de las apps personales (Notas, Habitos, Planner,
# Nutricion, Body Metrics) y les sube el JWT_SECRET, para no tener que instalar
# wrangler en local.
#
# Antes de la primera ejecucion hay que crear dos secretos del repositorio en
# Settings > Secrets and variables > Actions:
#
#   CLOUDFLARE_API_TOKEN   token de Cloudflare con permiso "Edit Cloudflare Workers"
#   SITE_JWT_SECRET        el MISMO valor que JWT_SECRET tiene en Vercel
#
# Si SITE_JWT_SECRET no coincide con el de Vercel, los workers rechazan todas las
# sesiones y las apps se quedan en la pantalla de login.

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Que desplegar'
        required: true
        default: 'todos'
        type: choice
        options:
          - todos
          - notes-worker
          - habits-worker
          - planner-worker
          - nutrition-worker
          - body-metrics-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: comprobar secretos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN del repositorio" >&2
            exit 1
          fi
          if [ -z "${{ secrets.SITE_JWT_SECRET }}" ]; then
            echo "Falta el secreto SITE_JWT_SECRET del repositorio" >&2
            exit 1
          fi

      - name: desplegar
        env:
          SITE_JWT_SECRET: ${{ secrets.SITE_JWT_SECRET }}
          PICK: ${{ inputs.worker }}
        run: |
          set -e
          if [ "$PICK" = "todos" ]; then
            LIST="notes-worker habits-worker planner-worker nutrition-worker body-metrics-worker"
          else
            LIST="$PICK"
          fi
          for w in $LIST; do
            echo "::group::$w"
            cd "workers/$w"
            # El secreto primero: si se despliega antes, hay una ventana en la que
            # el worker nuevo corre sin JWT_SECRET y rechaza a todo el mundo.
            printf '%s' "$SITE_JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET
            npx --yes wrangler@4 deploy
            cd ../..
            echo "::endgroup::"
          done
