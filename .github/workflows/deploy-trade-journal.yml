name: Deploy Trade Journal Worker

# Aplica las migraciones de D1 y despliega workers/trade-journal-worker.
# El orden importa: el worker nuevo consulta columnas que crean las migraciones.
# Token: input manual (cf_token) o secret CLOUDFLARE_API_TOKEN del repo.
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'Cloudflare API token (opcional si existe el secret CLOUDFLARE_API_TOKEN)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/trade-journal-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.cf_token || secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: check token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta cf_token (input) o CLOUDFLARE_API_TOKEN (secret)" >&2
            exit 1
          fi

      # d1 migrations apply lleva registro de lo aplicado, correrlo dos veces no rompe
      - name: aplicar migraciones D1
        run: npx --yes wrangler@4 d1 migrations apply trade-journal-db --remote

      # Los secretos primero: si se despliega antes, hay una ventana en la que el
      # worker nuevo corre sin ellos. Cada uno solo se sube si existe en el repo,
      # asi que este paso no falla por los que aun no esten configurados.
      - name: subir secretos
        env:
          SITE_JWT_SECRET: ${{ secrets.SITE_JWT_SECRET }}
          CRED_ENC_KEY: ${{ secrets.CRED_ENC_KEY }}
        run: |
          if [ -n "$SITE_JWT_SECRET" ]; then
            printf '%s' "$SITE_JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET
          else
            echo "SITE_JWT_SECRET no configurado: se deja el que ya tenga el worker"
          fi
          if [ -n "$CRED_ENC_KEY" ]; then
            printf '%s' "$CRED_ENC_KEY" | npx --yes wrangler@4 secret put CRED_ENC_KEY
          else
            echo "CRED_ENC_KEY no configurado: no se podran guardar claves de Bybit nuevas"
          fi

      - name: wrangler deploy
        run: npx --yes wrangler@4 deploy
