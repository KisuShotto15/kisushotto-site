name: Deploy Trade Journal Worker

# Aplica las migraciones de D1 y despliega workers/trade-journal-worker.
# El orden importa: el worker nuevo consulta columnas que crean las migraciones.
# Token: input manual (cf_token) o secret CLOUDFLARE_API_TOKEN del repo.
on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'Cloudflare API token (opcional si existe el secret CLOUDFLARE_API_TOKEN)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/trade-journal-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.cf_token || secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: check token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta cf_token (input) o CLOUDFLARE_API_TOKEN (secret)" >&2
            exit 1
          fi

      # d1 migrations apply lleva registro de lo aplicado, correrlo dos veces no rompe
      - name: aplicar migraciones D1
        run: npx --yes wrangler@4 d1 migrations apply trade-journal-db --remote

      - name: wrangler deploy
        run: npx --yes wrangler@4 deploy

      # Llave con la que el worker cifra las API keys de los exchanges. Se crea
      # una sola vez con un valor aleatorio que nadie conoce; nunca se pisa,
      # porque cambiarla dejaria ilegibles las llaves ya guardadas.
      - name: KEYS_SECRET (solo si no existe)
        run: |
          if npx --yes wrangler@4 secret list 2>/dev/null | grep -q 'KEYS_SECRET'; then
            echo "KEYS_SECRET ya existe, no se toca"
          else
            openssl rand -base64 48 | tr -d '\n' | npx --yes wrangler@4 secret put KEYS_SECRET
          fi

      # El cron llama al guardian cada minuto: si corrio, el Durable Object, D1
      # y la salida a internet funcionan. egress dice desde donde sale y si
      # Binance/Bitget responden ahi.
      - name: verificar guardian
        run: |
          npx --yes wrangler@4 d1 execute trade-journal-db --remote --command "UPDATE risk_state SET egress_at = 0"
          sleep 150
          npx --yes wrangler@4 d1 execute trade-journal-db --remote --json \
            --command "SELECT guardian_at, unixepoch() - guardian_at AS hace_seg, guardian_error, egress FROM risk_state; SELECT * FROM news_meta;"
